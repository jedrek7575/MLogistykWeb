<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta name="theme-color" content="#1a0525">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mLogistyk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mLogistyk</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      background-color: #240b36;
      background-image: linear-gradient(to bottom right, #240b36, #000000);
      margin: 0;
      height: 100vh;
      overflow: hidden; 
    }

    flutter-view {
      background-color: transparent !important;
    }

    #splash {
      height: 100vh; 
      width: 100vw;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
      background-image: linear-gradient(to bottom right, #240b36, #000000); /* Własne tło dla kurtyny */
      transition: opacity 0.5s ease-out; /* MAGIA 1: Ustawienie płynnego zanikania na pół sekundy */
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  
  <!-- EKRAN ŁADOWANIA -->
  <div id="splash">
    <div style="position: relative; width: 80px; height: 80px; display: flex; justify-content: center; align-items: center;">
      <div style="position: absolute; width: 100%; height: 100%; border: 2px solid transparent; border-top-color: #aa00ff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <div style="width: 40px; height: 40px; border: 1px solid rgba(170, 0, 255, 0.5);"></div>
    </div>

    <div style="margin-top: 30px; color: white; letter-spacing: 4px; font-size: 14px; font-weight: 300; text-shadow: 0 0 10px #aa00ff;">
      ŁĄCZENIE Z SERWEREM...
    </div>
  </div>

  <!-- Skrypt inicjalizujący Fluttera -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- MAGIA 2: Skrypt, który usuwa ekran ładowania, gdy Flutter jest gotowy -->
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) {
        // Zmień przezroczystość na 0 (uruchomi animację transition w CSS)
        splash.style.opacity = '0';
        
        // Po 500 milisekundach (gdy animacja się skończy), fizycznie usuń element z HTML, odblokowując klikanie
        setTimeout(function() {
          splash.remove();
        }, 500);
      }
    });
  </script>

</body>
</html>
